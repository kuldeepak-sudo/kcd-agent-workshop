# The Acme Support Copilot chat UI (unchanged from tyk-demo's mcp-token-
# exchange deployment — see services/acme-chat). A real browser OAuth client:
# support reps log in via Keycloak, and the chat calls MCP tools through the
# Tyk MCP proxy with the rep's bearer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-chat
  namespace: tyk-oss
spec:
  replicas: 1
  selector:
    matchLabels: { app: acme-chat }
  template:
    metadata:
      labels: { app: acme-chat }
    spec:
      containers:
        - name: acme-chat
          image: acme-chat:local
          imagePullPolicy: IfNotPresent
          env:
            # Browser-facing: must match the hostname the user's own machine
            # resolves via /etc/hosts + `kubectl port-forward svc/acme-keycloak`
            # (see setup.sh) — this is what the *user's browser* redirects to.
            - { name: IDP_AUTHORIZE_URL, value: "http://acme-keycloak:8280/realms/acme/protocol/openid-connect/auth" }
            # This one is a server-to-server call made BY this pod, so the
            # in-cluster short DNS name (resolvable within the tyk-oss
            # namespace) is fine even though it's the same literal hostname.
            - { name: IDP_TOKEN_URL, value: "http://acme-keycloak:8280/realms/acme/protocol/openid-connect/token" }
            - { name: CHAT_CLIENT_ID, value: "acme-support-chat" }
            - { name: CHAT_REDIRECT_URI, value: "http://localhost:8095/callback" }
            - { name: CHAT_SCOPES, value: "openid customers:all" }
            - { name: LOGIN_PROMPT, value: "login" }
            # This call is made by the pod itself (not the browser), so it
            # uses the in-cluster gateway service, not a port-forwarded localhost.
            - { name: MCP_ENDPOINT, value: "http://gateway-svc-tyk-oss-tyk-gateway.tyk-oss.svc.cluster.local:8080/acme-mcp/mcp" }
            - { name: CHAT_LISTEN, value: ":8090" }
          ports: [{ containerPort: 8090 }]
---
apiVersion: v1
kind: Service
metadata:
  name: acme-chat
  namespace: tyk-oss
spec:
  selector: { app: acme-chat }
  ports: [{ port: 8090, targetPort: 8090 }]
